<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Love Heart – Mary Grace Villanueva</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #060208;
      overflow: hidden;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }
    canvas {
      display: block;
      max-width: 100vw;
      max-height: 100vh;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    // Tuned parameters
    const SC = 21;
    const OY = 20;
    const DURATION = 9;
    const ANIM = 46;
    const LIFT = 36;
    const GAP = 6;
    const SIZES = [9, 10, 11, 12];
    const FONT = "Arial";
    const BG = "#060208";
    const BG_RGB = [6/255, 2/255, 8/255];
    const FLASH = [1.0, 0.80, 0.80];

    const PHRASES = [
      "I love you", "Seni seviyorum", "Te amo", "Je t'aime",
      "Ich liebe dich", "Ti amo", "Eu te amo", "Я тебя люблю",
      "사랑해", "愛してる", "我爱你", "मैं तुमसे प्यार करता हूँ",
      "Σ' αγαπώ", "Ik hou van jou", "Jag älskar dig", "Kocham cię",
      "ฉันรักเธอ", "Anh yêu em", "Aku cinta kamu", "Я тебе кохаю"
    ];

    class RNG {
      constructor(seed = 11) { this.s = seed; }
      next() {
        this.s = (this.s * 16807) % 2147483647;
        return (this.s - 1) / 2147483646;
      }
      uniform(a, b) { return a + this.next() * (b - a); }
      choice(arr) { return arr[Math.floor(this.next() * arr.length)]; }
      shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(this.next() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }
    }
    const rng = new RNG(11);

    function heart(a) {
      const x = 16 * Math.pow(Math.sin(a), 3);
      const y = 13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a);
      return [x * SC, y * SC + OY];
    }

    function hx(c) {
      return `rgb(${Math.round(c[0]*255)},${Math.round(c[1]*255)},${Math.round(c[2]*255)})`;
    }
    function mix(a, b, k) {
      return [a[0]+(b[0]-a[0])*k, a[1]+(b[1]-a[1])*k, a[2]+(b[2]-a[2])*k];
    }
    function dim(c, k) { return [c[0]*k, c[1]*k, c[2]*k]; }
    function clamp(v) { return Math.max(0, Math.min(1, v)); }
    function mathSin(v) { return Math.sin(Math.PI * v); }

    const POLY = [];
    for (let i = 0; i < 720; i++) POLY.push(heart(2 * Math.PI * i / 720));
    const EDGES = POLY.map((p, i) => [p, POLY[(i + 1) % 720]]);
    const YMAX = Math.max(...POLY.map(p => p[1]));
    const YMIN = Math.min(...POLY.map(p => p[1]));
    const CY = (YMAX + YMIN) / 2;

    function spans(y) {
      const xs = [];
      for (const [[x1,y1],[x2,y2]] of EDGES) {
        if ((y1 <= y && y < y2) || (y2 <= y && y < y1)) {
          xs.push(x1 + (y - y1) * (x2 - x1) / (y2 - y1));
        }
      }
      xs.sort((a,b) => a - b);
      const pairs = [];
      for (let i = 0; i < xs.length; i += 2) {
        if (i + 1 < xs.length) pairs.push([xs[i], xs[i+1]]);
      }
      return pairs;
    }

    function intersect(A, B) {
      const out = [];
      for (const a of A) {
        for (const b of B) {
          const lo = Math.max(a[0], b[0]);
          const hi = Math.min(a[1], b[1]);
          if (hi - lo > 14) out.push([lo, hi]);
        }
      }
      return out;
    }

    function measureText(text, size) {
      ctx.font = `bold ${size}px ${FONT}`;
      return ctx.measureText(text).width;
    }

    function mathDist(x, y) {
      return Math.hypot(x / (16 * SC), (y - CY) / (14.5 * SC));
    }

    function* phraseCycle() {
      while (true) {
        const order = [...PHRASES];
        rng.shuffle(order);
        yield* order;
      }
    }

    function build() {
      const cycle = phraseCycle();
      const rowH = Math.max(...SIZES.map(s => s * 1.35)) + 4;
      const half = rowH / 2;
      const placed = [];

      // Moderate clear zone around the name so it stays readable
      const NAME_Y = CY + 55;
      const CLEAR_HALF_W = 125;
      const CLEAR_HALF_H = 16;

      let y = YMAX - half;
      while (y > YMIN + half) {
        const row = intersect(spans(y + half), spans(y - half));
        for (let [lo, hi] of row) {
          lo += 3;
          hi -= 3;

          const segments = [];
          // Clear space only near the name's vertical position
          if (Math.abs(y - NAME_Y) < CLEAR_HALF_H) {
            if (lo < -CLEAR_HALF_W) segments.push([lo, Math.min(hi, -CLEAR_HALF_W)]);
            if (hi > CLEAR_HALF_W)  segments.push([Math.max(lo, CLEAR_HALF_W), hi]);
          } else {
            segments.push([lo, hi]);
          }

          for (const [sLo, sHi] of segments) {
            if (sHi - sLo < 18) continue;

            let cur = sLo + rng.uniform(0, 5);
            const line = [];

            while (true) {
              let fit = null;
              for (let attempt = 0; attempt < 12; attempt++) {
                const text = cycle.next().value;
                const size = rng.choice(SIZES);
                const w = measureText(text, size);
                if (cur + w <= sHi) {
                  fit = { text, size, w };
                  break;
                }
              }
              if (!fit) break;
              line.push([cur + fit.w / 2, fit.text, fit.size, fit.w]);
              cur += fit.w + GAP;
            }

            if (line.length === 0) continue;

            if (line.length > 1) {
              const left = sHi - (line[line.length-1][0] + line[line.length-1][3]/2);
              for (let i = 0; i < line.length; i++) {
                line[i][0] += left * i / (line.length - 1);
              }
            } else {
              line[0][0] = (sLo + sHi) / 2;
            }

            for (let i = 0; i < line.length; i++) {
              const [x, text, size] = line[i];
              const edge = (i === 0 || i === line.length - 1);
              placed.push({ x, y, text, size, edge });
            }
          }
        }
        y -= rowH;
      }

      // Color grading – same as original
      const wine = [0.58, 0.0, 0.09];
      const crimson = [0.90, 0.05, 0.14];
      const blood = [0.98, 0.10, 0.16];

      for (const p of placed) {
        const rad = Math.min(1.0, mathDist(p.x, p.y));
        let base = mix(wine, crimson, 0.25 + 0.75 * rad);
        base = mix(base, blood, rng.uniform(0, 0.35) + (p.edge ? 0.3 : 0));
        p.color = base.map(v => Math.min(1, v));
        p.rad = rad;
      }

      // Name higher, with clear space so it is readable
      const nameColor = mix(crimson, blood, 0.50);
      placed.push({
        x: 0,
        y: CY + 55,
        text: "Mary Grace Villanueva",
        size: 14,
        edge: false,
        color: nameColor,
        rad: 0,
        isName: true
      });

      const edges = placed.filter(p => p.edge && !p.isName);
      const inner = placed.filter(p => !p.edge && !p.isName);
      edges.sort((a, b) => Math.atan2(a.x, a.y - CY) - Math.atan2(b.x, b.y - CY));
      inner.sort((a, b) => (-a.rad + rng.uniform(0, 0.08)) - (-b.rad + rng.uniform(0, 0.08)));

      // Put the name near the end so it appears later with the rest
      return edges.concat(inner).concat(placed.filter(p => p.isName));
    }

    // High-DPI
    let scale = 1;
    let dpr = 1;

    function resize() {
      dpr = window.devicePixelRatio || 1;
      const size = Math.min(window.innerWidth, window.innerHeight, 820);
      canvas.style.width = size + 'px';
      canvas.style.height = size + 'px';
      canvas.width = size * dpr;
      canvas.height = size * dpr;
      scale = size / 800;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    window.addEventListener('resize', resize);

    let ORDER = [];
    let items;
    let active = [];
    let settled = [];
    let spawning = true;
    let acc = 0;
    let RATE = 0;
    let startTime = 0;

    function spawn(p) {
      active.push({
        ...p,
        f: 0,
        dx: rng.uniform(-10, 10)
      });
    }

    function animate(p) {
      p.f += 1;
      const u = clamp(p.f / ANIM);
      const e = 1 - Math.pow(1 - u, 3);

      const x = p.x;
      const y = -p.y;
      const hover = (1 - e) * LIFT;

      p.px = x + p.dx * (1 - e);
      p.py = y - hover;
      p.e = e;
      p.u = u;

      if (u >= 1) {
        p.px = x;
        p.py = y;
        p.settled = true;
        settled.push(p);
        return false;
      }
      return true;
    }

    function drawText(item, isActive) {
      const { text, size, color, px, py, e = 1, u = 1 } = item;
      const cx = canvas.width / dpr / 2;
      const cy = canvas.height / dpr / 2;

      const sx = cx + px * scale;
      const sy = cy + py * scale;

      ctx.save();
      ctx.translate(sx, sy);
      ctx.scale(scale, scale);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // Soft shadow (identical for every phrase including the name)
      ctx.font = `bold ${size}px ${FONT}`;
      const shadowCol = mix(BG_RGB, dim(color, 0.28), e);
      ctx.fillStyle = hx(shadowCol);
      ctx.fillText(text, 1.6, 2.2);

      // Subtle halo
      ctx.font = `bold ${size + 0.7}px ${FONT}`;
      const haloCol = mix(BG_RGB, dim(color, 0.18), e * e);
      ctx.fillStyle = hx(haloCol);
      ctx.fillText(text, 0, 0);

      // Main text – same rendering path for the name
      ctx.font = `bold ${size}px ${FONT}`;
      let flash = 0;
      if (isActive) {
        flash = 0.65 * mathSin(clamp((u - 0.5) / 0.5));
      }
      const col = mix(mix(BG_RGB, color, Math.pow(e, 1.4)), FLASH, flash);
      ctx.fillStyle = hx(col);
      ctx.fillText(text, 0, 0);

      ctx.restore();
    }

    function step(timestamp) {
      if (!startTime) startTime = timestamp;

      if (spawning) {
        acc += RATE;
        try {
          while (acc >= 1) {
            acc -= 1;
            const next = items.next();
            if (next.done) {
              spawning = false;
              break;
            }
            spawn(next.value);
          }
        } catch (e) {
          spawning = false;
        }
      }

      active = active.filter(p => animate(p));

      // Clear
      ctx.fillStyle = BG;
      ctx.fillRect(0, 0, canvas.width / dpr, canvas.height / dpr);

      // Settled phrases
      for (const p of settled) {
        drawText(p, false);
      }

      // Currently animating
      for (const p of active) {
        drawText(p, true);
      }

      // Soft random shimmer
      if (!spawning && active.length === 0 && Math.random() < 0.012) {
        const idx = Math.floor(Math.random() * settled.length);
        if (settled[idx]) settled[idx].flashUntil = performance.now() + 260;
      }

      requestAnimationFrame(step);
    }

    function start() {
      ctx.font = `bold 12px ${FONT}`;
      ORDER = build();
      items = ORDER[Symbol.iterator]();
      RATE = ORDER.length / (DURATION * 60);
      acc = 0;
      spawning = true;
      active = [];
      settled = [];
      startTime = 0;
      requestAnimationFrame(step);
    }

    start();
  </script>
</body>
</html>
